# JobSet level 1: one gang for the whole JobSet.
# driver (1 job x 1 pod) + workers (2 jobs x 2 pods) = 5 pods in a single
# PodGroup with gang.minCount=5. Nothing starts until all 5 can be placed.
# Requires the JobSet feature gate JobSetWorkloadAwareSchedulingAPI=true.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset-level1
  namespace: scheduling-beta-examples
spec:
  successPolicy:
    operator: All
  failurePolicy:
    maxRestarts: 0
  scheduling:
    schedulingPolicy:
      gang: {}
  replicatedJobs:
  - name: driver
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        completionMode: Indexed
        backoffLimit: 0
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              scheduling-example: jobset-level1
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: driver
              image: docker.io/library/busybox:1.36.1
              command: ["sh", "-c", "echo $(hostname) started at $(date -u); sleep 120"]
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
  - name: workers
    replicas: 2
    template:
      spec:
        parallelism: 2
        completions: 2
        completionMode: Indexed
        backoffLimit: 0
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              scheduling-example: jobset-level1
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: workers
              image: docker.io/library/busybox:1.36.1
              command: ["sh", "-c", "echo $(hostname) started at $(date -u); sleep 120"]
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
