# DisaggregatedSet with native gang scheduling: a prefill/decode split, the
# typical disaggregated-serving shape. The DisaggregatedSet controller (bundled
# with LWS v1.0.0) creates one LeaderWorkerSet per role. Each role's
# `scheduling: {}` is passed through to its LWS, so LWS creates one Workload plus
# one PodGroup per replica group:
#   prefill: 2 replicas x size 2 -> 2 PodGroups, gang.minCount=2 each
#   decode:  1 replica  x size 3 -> 1 PodGroup,  gang.minCount=3
# Each leader+workers group is admitted all-or-nothing; groups and roles schedule
# independently. Requires the LWS feature gate WorkloadAwareScheduling=true
# and schedulerProvider=kubernetes (see lws-values.yaml).
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: dset-gang
  namespace: scheduling-beta-examples
spec:
  roles:
  - name: prefill
    spec:
      replicas: 2
      scheduling: {}
      leaderWorkerTemplate:
        size: 2
        workerTemplate:
          metadata:
            labels:
              scheduling-example: dset-gang
          spec:
            restartPolicy: Always
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: prefill
              image: docker.io/library/busybox:1.36.1
              command: ["sh", "-c", "echo prefill $(hostname) started at $(date -u); sleep infinity"]
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
  - name: decode
    spec:
      replicas: 1
      scheduling: {}
      leaderWorkerTemplate:
        size: 3
        workerTemplate:
          metadata:
            labels:
              scheduling-example: dset-gang
          spec:
            restartPolicy: Always
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: decode
              image: docker.io/library/busybox:1.36.1
              command: ["sh", "-c", "echo decode $(hostname) started at $(date -u); sleep infinity"]
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
