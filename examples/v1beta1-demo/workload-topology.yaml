# Workload describes the template; it does not create PodGroups or pods itself.
apiVersion: scheduling.k8s.io/v1beta1
kind: Workload
metadata:
  name: workload-topology
  namespace: scheduling-beta-examples
spec:
  podGroupTemplates:
  - name: workers
    schedulingPolicy:
      gang:
        minCount: 2
    schedulingConstraints:
      topology:
      - key: kubernetes.io/hostname
---
# Instantiate the template explicitly, copying its scheduling settings.
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: workload-topology-workers
  namespace: scheduling-beta-examples
spec:
  workloadRef:
    workloadName: workload-topology
    templateName: workers
  schedulingPolicy:
    gang:
      minCount: 2
  schedulingConstraints:
    topology:
    - key: kubernetes.io/hostname
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workload-topology
  namespace: scheduling-beta-examples
spec:
  parallelism: 2
  completions: 2
  completionMode: Indexed
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        scheduling-example: workload-topology
    spec:
      schedulingGroup:
        podGroupName: workload-topology-workers
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: docker.io/library/busybox:1.36.1
        command: ["sh", "-c", "echo Started at $(date -u); sleep 300"]
        resources:
          requests:
            cpu: 100m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
