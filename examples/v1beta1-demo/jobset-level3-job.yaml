# JobSet level 3: one gang per Job (each replica of a ReplicatedJob).
# workers has 3 replicas x 2 pods. `job:` gives every worker Job its own
# PodGroup with minCount=2, so each 2-pod slice is admitted all-or-nothing but
# slices schedule independently of each other. The launcher keeps a level 2 gang.
# Every ReplicatedJob must be targeted by exactly one entry.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset-level3
  namespace: scheduling-beta-examples
spec:
  successPolicy:
    operator: All
  failurePolicy:
    maxRestarts: 0
  scheduling:
    replicatedJobs:
    - targetReplicatedJobs: ["launcher"]
      schedulingPolicy:
        gang: {}
    - targetReplicatedJobs: ["workers"]
      job:
        schedulingPolicy:
          gang: {}
  replicatedJobs:
  - name: launcher
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        completionMode: Indexed
        backoffLimit: 0
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              scheduling-example: jobset-level3
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: launcher
              image: docker.io/library/busybox:1.36.1
              command: ["sh", "-c", "echo $(hostname) started at $(date -u); sleep 120"]
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
  - name: workers
    replicas: 3
    template:
      spec:
        parallelism: 2
        completions: 2
        completionMode: Indexed
        backoffLimit: 0
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              scheduling-example: jobset-level3
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: workers
              image: docker.io/library/busybox:1.36.1
              command: ["sh", "-c", "echo $(hostname) started at $(date -u); sleep 120"]
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
