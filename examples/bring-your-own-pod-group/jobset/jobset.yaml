---
apiVersion: scheduling.k8s.io/v1alpha2
kind: Workload
metadata:
  name: js-abc
spec:
  controllerRef:
    apiGroup: jobset.x-k8s.io
    kind: JobSet
    name: js
  podGroupTemplates:
  - name: workers
    schedulingPolicy:
      gang:
        minCount: 6
---
apiVersion: scheduling.k8s.io/v1alpha2
kind: PodGroup
metadata:
  name: js-abc-workers-def
  namespace: default
spec:
  podGroupTemplateRef:
    workload:
      workloadName: js-abc
      podGroupTemplateName: workers
  schedulingPolicy:
    gang:
      minCount: 6
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: js
spec:
  replicatedJobs:
  - name: rj
    replicas: 3
    template:
      spec:
        completions: 2
        parallelism: 2
        backoffLimit: 0
        template:
          spec:
            terminationGracePeriodSeconds: 0
            schedulingGroup:
              podGroupName: js-abc-workers-def
            containers:
            - name: worker
              image: busybox
              command: ["/bin/sh", "-c", "sleep infinity"]
            resources:
              requests:
                cpu: "4" # Worker node has 16 CPUs, so only 3 of 6 Pods will be scheduled

