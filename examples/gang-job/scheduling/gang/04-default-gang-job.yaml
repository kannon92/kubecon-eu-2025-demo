# Kubernetes 1.37 native Job with the default gang policy and gang-wide
# disruption. No gang minCount is specified; the Job API applies its default
# gang size.
apiVersion: batch/v1
kind: Job
metadata:
  name: default-gang-job
  namespace: default
spec:
  parallelism: 4
  completions: 4
  completionMode: Indexed
  backoffLimit: 0
  scheduling:
    schedulingPolicy:
      gang: {}
    disruptionMode:
      all: {}
  template:
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: worker
        image: quay.io/quay/busybox:latest
        command: ["sleep", "10000"]
        resources:
          requests:
            cpu: "3"
            memory: 100Mi
          limits:
            cpu: "3"
            memory: 100Mi
      restartPolicy: Never
