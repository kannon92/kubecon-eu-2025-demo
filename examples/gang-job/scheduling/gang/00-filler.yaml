---
# kind-worker4 is filled completely: no room left for any gang pod.
apiVersion: v1
kind: Pod
metadata:
  name: filler-4
  namespace: default
  labels:
    app: filler
spec:
  nodeSelector:
    kubernetes.io/hostname: kind-worker4
  terminationGracePeriodSeconds: 0
  containers:
  - name: filler
    image: quay.io/quay/busybox:latest
    command: ["sleep", "10000"]
    resources:
      requests:
        cpu: "15"
        memory: 100Mi
      limits:
        cpu: "15"
        memory: 100Mi
