apiVersion: batch/v1
kind: Job
metadata:
  name: no-gang-explicit
  namespace: test
spec:
  suspend: false
  parallelism: 10
  completions: 10
  completionMode: Indexed
  template:
    spec:
      containers:
      - name: sleep-container
        image: quay.io/quay/busybox:latest
        command: ["sleep", "10000"]
        resources:
          requests:
            cpu: 2
            memory: 100Mi
          limits:
            cpu: 2
            memory: 100Mi
      restartPolicy: Never
  backoffLimit: 4